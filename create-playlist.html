<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundGrid - Create Playlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/home.css" />
    <link rel="stylesheet" href="styles/my-playlists.css" />
    <link rel="stylesheet" href="styles/create-playlist.css" />
  </head>
  <body>
    <div id="app">
      <div class="app-shell">
        <aside class="app-sidebar" aria-label="Primary Navigation">
          <div>
            <a href="index.html" class="sidebar-brand">
              <span class="sidebar-brand__icon" aria-hidden="true">
                <img
                  src="resources/SoundGrid logo.png"
                  alt="SoundGrid Logo"
                  class="brand-logo-img"
                />
              </span>
              <span class="sidebar-brand__title">SoundGrid</span>
            </a>

            <nav class="sidebar-nav">
              <a href="index.html" class="sidebar-nav__item">
                <i class="ri-home-5-line"></i>
                <span>Home</span>
              </a>

              <a href="search.html" class="sidebar-nav__item">
                <i class="ri-search-line"></i>
                <span>Search</span>
              </a>

              <a href="my-playlists.html" class="sidebar-nav__item">
                <i class="ri-play-list-line"></i>
                <span>My Playlists</span>
              </a>

              <a
                href="create-playlist.html"
                class="sidebar-nav__item is-active"
              >
                <i class="ri-add-circle-line"></i>
                <span>Create Playlist</span>
              </a>

              <a href="profile.html" class="sidebar-nav__item">
                <i class="ri-user-3-line"></i>
                <span>Profile</span>
              </a>
            </nav>
          </div>

          <div class="sidebar-footer">
            <a href="playlist-details.html" class="sidebar-auth-switch">
              <i class="ri-headphone-line"></i>
              <span>Calm Vibes</span>
            </a>
            <a href="login.html" class="sidebar-auth-switch">
              <i class="ri-lock-line"></i>
              <span>Login / Register</span>
            </a>
          </div>
        </aside>

        <main class="app-main">
          <header class="app-topbar">
            <div class="topbar-search">
              <i class="ri-search-line"></i>
              <input
                type="search"
                id="global-topbar-search"
                class="topbar-search__input"
                placeholder="Search songs, artists, playlists..."
                aria-label="Search songs, artists, playlists"
              />
            </div>

            <div class="topbar-profile">
              <a
                href="my-playlists.html"
                class="topbar-icon-btn"
                title="Shared Playlists"
              >
                <i class="ri-group-line"></i>
              </a>
              <a href="login.html" class="topbar-badge" title="Switch Account"
                >MH</a
              >
              <a href="profile.html" title="View Profile">
                <img
                  src="https://ui-avatars.com/api/?name=Mohamed+hanfal&background=1f2937&color=fff&size=64"
                  alt="User Avatar"
                  class="topbar-avatar"
                />
              </a>
            </div>
          </header>

          <div class="view-container">
            <div class="my-playlists-header">
              <div>
                <h1 class="my-playlists-header__title">Create New Playlist</h1>
                <p class="my-playlists-header__subtitle">
                  Enter playlist details and pick tracks from your library
                </p>
              </div>
            </div>

            <form action="playlist-details.html">
              <div class="create-form-grid">
                <div class="cover-dropzone" title="Choose cover image">
                  <div class="cover-dropzone__preview">
                    <i class="ri-image-add-line"></i>
                  </div>
                  <div class="cover-dropzone__title">Upload Cover Image</div>
                  <div class="cover-dropzone__sub">PNG or JPG up to 5MB</div>
                </div>

                <div class="form-fields">
                  <div class="form-group">
                    <label for="pl-title-input">Playlist Name</label>
                    <input
                      type="text"
                      id="pl-title-input"
                      class="form-control"
                      placeholder="Late Night Study Mix"
                      required
                    />
                  </div>

                  <div class="form-group">
                    <label for="pl-desc-input">Description</label>
                    <textarea
                      id="pl-desc-input"
                      class="form-control"
                      rows="3"
                      placeholder="Notes about this playlist..."
                    ></textarea>
                  </div>

                  <div class="form-actions">
                    <button type="submit" class="btn btn--primary">
                      Save &amp; Open Playlist
                    </button>
                    <a href="my-playlists.html" class="btn btn--outline"
                      >Cancel</a
                    >
                  </div>
                </div>
              </div>

              <section class="sg-section">
                <div class="sg-section__header">
                  <h2 class="sg-section__title">Select Songs to Add</h2>
                </div>

                <div class="song-checklist">
                  <label class="song-check-row">
                    <div class="song-check-row__left">
                      <span class="song-check-row__index">1</span>
                      <div>
                        <div class="song-check-row__title">Faded</div>
                        <div class="song-check-row__meta">
                          Alan Walker &bull; Different World
                        </div>
                      </div>
                    </div>
                    <div class="song-check-row__right">
                      <span class="song-check-row__duration">3:32</span>
                      <input type="checkbox" name="songIds" value="1" checked />
                    </div>
                  </label>

                  <label class="song-check-row">
                    <div class="song-check-row__left">
                      <span class="song-check-row__index">2</span>
                      <div>
                        <div class="song-check-row__title">Blinding Lights</div>
                        <div class="song-check-row__meta">
                          The Weeknd &bull; After Hours
                        </div>
                      </div>
                    </div>
                    <div class="song-check-row__right">
                      <span class="song-check-row__duration">3:20</span>
                      <input type="checkbox" name="songIds" value="2" checked />
                    </div>
                  </label>

                  <label class="song-check-row">
                    <div class="song-check-row__left">
                      <span class="song-check-row__index">3</span>
                      <div>
                        <div class="song-check-row__title">Billie Jean</div>
                        <div class="song-check-row__meta">
                          Michael Jackson &bull; Thriller
                        </div>
                      </div>
                    </div>
                    <div class="song-check-row__right">
                      <span class="song-check-row__duration">4:54</span>
                      <input type="checkbox" name="songIds" value="3" checked />
                    </div>
                  </label>

                  <label class="song-check-row">
                    <div class="song-check-row__left">
                      <span class="song-check-row__index">4</span>
                      <div>
                        <div class="song-check-row__title">Unity</div>
                        <div class="song-check-row__meta">
                          TheFatRat &bull; Unity
                        </div>
                      </div>
                    </div>
                    <div class="song-check-row__right">
                      <span class="song-check-row__duration">4:09</span>
                      <input type="checkbox" name="songIds" value="4" />
                    </div>
                  </label>

                  <label class="song-check-row">
                    <div class="song-check-row__left">
                      <span class="song-check-row__index">5</span>
                      <div>
                        <div class="song-check-row__title">Srivalli</div>
                        <div class="song-check-row__meta">
                          Sid Sriram &bull; Pushpa: The Rise
                        </div>
                      </div>
                    </div>
                    <div class="song-check-row__right">
                      <span class="song-check-row__duration">3:41</span>
                      <input type="checkbox" name="songIds" value="5" />
                    </div>
                  </label>
                </div>
              </section>
            </form>
          </div>
        </main>

        <footer class="app-player" aria-label="Audio Player">
          <div class="player-now-playing">
            <div class="player-thumb">
              <img
                src="resources/covers/alan walker cover.jpg"
                alt="Now Playing"
                id="player-thumb-img"
              />
            </div>
            <div class="player-meta">
              <div class="player-meta__title" id="player-song-title">Faded</div>
              <div class="player-meta__artist" id="player-song-artist">
                Alan Walker
              </div>
            </div>
          </div>

          <div class="player-center">
            <div class="player-transport">
              <button
                type="button"
                class="player-ctrl-btn"
                id="player-btn-shuffle"
                aria-label="Shuffle"
              >
                <i class="ri-shuffle-line"></i>
              </button>
              <button
                type="button"
                class="player-ctrl-btn"
                id="player-btn-prev"
                aria-label="Previous"
              >
                <i class="ri-skip-back-fill"></i>
              </button>
              <button
                type="button"
                class="player-play-circle"
                id="player-btn-play"
                aria-label="Play"
              >
                <i class="ri-play-fill player-play-icon"></i>
              </button>
              <button
                type="button"
                class="player-ctrl-btn"
                id="player-btn-next"
                aria-label="Next"
              >
                <i class="ri-skip-forward-fill"></i>
              </button>
              <button
                type="button"
                class="player-ctrl-btn"
                id="player-btn-repeat"
                aria-label="Repeat"
              >
                <i class="ri-repeat-2-line"></i>
              </button>
            </div>

            <div class="player-timeline">
              <span class="player-time" id="player-time-current">0:45</span>
              <input
                type="range"
                min="0"
                max="100"
                value="20"
                class="sg-slider"
                id="player-scrubber"
                aria-label="Seek timeline"
              />
              <span class="player-time player-time--end" id="player-time-total"
                >3:32</span
              >
            </div>
          </div>

          <div class="player-right">
            <div class="player-volume-wrap">
              <button
                type="button"
                class="player-ctrl-btn"
                id="player-btn-mute"
                aria-label="Mute"
              >
                <i class="ri-volume-up-line"></i>
              </button>
              <input
                type="range"
                min="0"
                max="100"
                value="65"
                class="sg-slider"
                id="player-volume-slider"
                aria-label="Volume"
              />
            </div>
            <a
              href="playlist-details.html"
              class="player-ctrl-btn"
              title="Open Current Playlist"
              aria-label="Queue"
            >
              <i class="ri-play-list-2-fill"></i>
            </a>
          </div>
        </footer>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
